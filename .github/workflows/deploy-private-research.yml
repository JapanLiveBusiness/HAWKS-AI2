name: Deploy private research studio

on:
  workflow_dispatch:

concurrency:
  group: private-research-ai-baseball
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      RESEARCH_BRANCH: private-analytics-only

    steps:
      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not available to this workflow"
              missing=1
            fi
          done
          exit "$missing"

      - name: Connect to Tailscale with OAuth
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          timeout: 1m

      - name: Resolve server-01 and test SSH
        shell: bash
        run: |
          set -euo pipefail
          resolved=""
          for attempt in $(seq 1 12); do
            resolved="$(tailscale status --json | jq -r '
              [.Peer[] | select(.HostName == "server-01" and .Online == true) | (.TailscaleIPs // [])[0]]
              | map(select(. != null)) | .[0] // empty
            ')"
            [ -n "$resolved" ] && break
            sleep 5
          done
          if [ -z "$resolved" ]; then
            echo "::error::server-01 is not visible as an online Tailscale peer"
            exit 1
          fi
          nc -vz -w 10 "$resolved" "$DEPLOY_PORT"
          echo "DEPLOY_HOST_RESOLVED=$resolved" >> "$GITHUB_ENV"

      - name: Configure deployment SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null

      - name: Deploy isolated research container
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST_RESOLVED" \
            "RESEARCH_BRANCH='$RESEARCH_BRANCH' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="/home/user/apps/AI-BASEBALL2026-research"
          REPO_URL="https://github.com/JapanLiveBusiness/AI-BASEBALL2026.git"
          BRANCH="$RESEARCH_BRANCH"

          mkdir -p "$(dirname "$APP_DIR")"
          if [ ! -d "$APP_DIR/.git" ]; then
            rm -rf "$APP_DIR"
            git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$APP_DIR"
          fi

          current_origin="$(git -C "$APP_DIR" remote get-url origin)"
          if [ "$current_origin" != "$REPO_URL" ] && [ "$current_origin" != "${REPO_URL%.git}" ]; then
            echo "unexpected origin for $APP_DIR: $current_origin"
            exit 1
          fi

          cd "$APP_DIR"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

          APP_DIR="$APP_DIR" \
          DATA_DIR="/opt/hawks-ai/research-data" \
          BRANCH="$BRANCH" \
          CONTAINER_NAME="hawks-research-app" \
          IMAGE_NAME="hawks-research-app" \
          PORT="8502" \
          TRAEFIK_HOST="ai-baseball-studio.f-polaris.jp" \
          TRAEFIK_LEGACY_HOST="" \
          TRAEFIK_ROUTER_NAME="ai-baseball-research" \
          TRAEFIK_SERVICE_NAME="ai-baseball-research" \
          TRAEFIK_PRIORITY="100" \
          bash scripts/deploy-production.sh
          REMOTE

      - name: Verify protected studio endpoint
        shell: bash
        env:
          SITE_URL: https://ai-baseball-studio.f-polaris.jp/
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            curl -fsS --max-time 20 \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$SITE_URL/_stcore/health"
          else
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL")"
            echo "Unauthenticated site status: $status"
            case "$status" in
              200) echo "::warning::Endpoint is reachable without Access authentication" ;;
              *) echo "Protected endpoint did not expose the application directly" ;;
            esac
          fi

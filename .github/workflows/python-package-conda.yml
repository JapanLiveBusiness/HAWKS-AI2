name: Python CI

on:
  push:
    branches:
      - main-AI-BASEBALL
  pull_request:
    branches:
      - main-AI-BASEBALL

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8
      - name: Check Python syntax and undefined names
        run: |
          python -m py_compile app.py main.py
          flake8 app.py main.py --count --select=E9,F63,F7,F82 --show-source --statistics
